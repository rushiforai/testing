name: Sync community requests

# Mirrors the Morphe community request board into GitHub issues labelled `request-feed`.
# An issue created here is inert: the AI patch workflow only starts its agent after a
# maintainer comments `approve` (optionally `approve <url>`) on that issue.
#
# GitHub only runs scheduled workflows that exist on the default branch, which is `dev`.
# A run can also be started with `workflow_dispatch` on `dev`.
#
# New requests come from the full board API; the RSS feed supplies update events (patch text,
# last activity, link). A failed or malformed feed warns and falls back to the API, and a bad
# API entry is skipped. Nothing is capped: every untracked request becomes an issue in one
# run, so a first sync creates the whole backlog.
#
# The board reports `exists` once a patch for that app exists; the sync closes the matching
# issue with a comment instead of leaving it open for someone to approve. Issues the agent
# has locked mid-run are left alone until the run finishes.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print planned creates/updates without changing issues"
        type: boolean
        default: false
      close_exists:
        description: "Close tracked issues the board already lists as having a patch"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: requests-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync requests
    runs-on: ubuntu-latest
    # Uncapped: a cold sync can create the whole backlog, about 1.2s per issue.
    timeout-minutes: 60
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Mirror the request feed into issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${{ inputs.close_exists }}" != "false" ]; then
            args+=(--close-exists)
          fi
          python3 .github/scripts/requests_sync.py "${args[@]}"
