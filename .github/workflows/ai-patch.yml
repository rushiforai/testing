name: AI patch agent

# Turns a "App patch request" issue into a Morphe patch, pushes it to `dev`, and replies on the
# issue. Comment `worked` on the issue to close it, or comment more details to retry.
#
# The agent brief is supplied only through the AGENT_BRIEF repository secret. Its rules half
# goes into the runner-temporary prompt; its reference half is written to $RUNNER_TEMP/brief
# and read on demand, so it is not resent with every model turn. Neither enters the repository.
# Reference patches are a sparse checkout of morphe-archive/examplepatches at $EXAMPLE_PATCHES_DIR.
#
# Secrets:
#   AI_API_KEY         required; OpenAI-compatible API key
#   AI_MODEL           required; model id
#   AGENT_BRIEF        required; the only agent brief (AGENTS.md content). Keep it out of the repository.
#   AI_BASE_URL        optional; defaults to https://tokenharbor.ai/v1. Must be an
#                      OpenAI-compatible root that serves /v1/chat/completions; a bare host
#                      or the provider's /docs page is normalised to /v1.
#
# This file must exist on the repository's default branch for `issues` / `issue_comment` events.
# Runs are serialized: GitHub Actions keeps one run active and one pending, so a newer pending
# run replaces an older pending one. The active issue is locked and unlocked by the first/last jobs.
#
# Issues synced from morphe-patches.software (label `request-feed`) do not start the agent on
# creation. The `gate` job waits for a maintainer to comment `approve` (optionally
# `approve <url>`), and only then does the rest of the pipeline run.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: number

concurrency:
  group: ai-patch
  cancel-in-progress: false

jobs:
  # Cheap pre-flight: a synced community request is inert until a maintainer comments
  # `approve`. Doing this before checkout and toolchain setup means an unapproved request
  # costs seconds, not a full job.
  gate:
    name: Check approval
    if: vars.AI_PATCH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The gate records an approval URL in the issue body; the agent job stays read-only.
      issues: write
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Check whether this run is approved
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ai_patch.py gate

  lock:
    name: Lock issue
    needs: gate
    if: vars.AI_PATCH_ENABLED != 'false' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      locked: ${{ steps.lock.outputs.locked }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Lock issue while CI runs
        id: lock
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "::warning::No issue number; skipping issue lock"
            exit 0
          fi

          ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")
          if jq -e '.pull_request != null' <<< "$ISSUE" >/dev/null; then
            echo "Not an issue; skipping lock"
            exit 0
          fi
          if [ "$(jq -r '.state' <<< "$ISSUE")" != "open" ]; then
            echo "Issue is not open; skipping lock"
            exit 0
          fi
          if [ "$(jq -r '.locked' <<< "$ISSUE")" = "true" ]; then
            echo "Issue is already locked; leaving it unchanged"
            exit 0
          fi
          if ! jq -e '(.labels[]?.name == "ai-patch") or (.title | startswith("patch: ")) or ((.body // "") | (contains("### App file download URL") or contains("### Direct app file download URL")))' <<< "$ISSUE" >/dev/null; then
            echo "Not a patch request; skipping lock"
            exit 0
          fi

          if gh issue lock "$ISSUE_NUMBER" --reason "resolved"; then
            echo "locked=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" \
              --body "🔒 **CI is running for this issue.** Comments are locked until the run finishes so new comments don't interrupt it. The bot will unlock the issue automatically.

          <!-- ai-patch-lock -->" \
              || echo "::warning::Could not post the lock comment"
          else
            echo "::warning::Could not lock issue #${ISSUE_NUMBER}; continuing without a lock"
          fi

  agent:
    name: Generate patch
    needs: [gate, lock]
    if: vars.AI_PATCH_ENABLED != 'false' && needs.gate.outputs.run == 'true'
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
    runs-on: ubuntu-latest
    # 360 is the hard cap for a GitHub-hosted job, so the budget is: ~2 min of setup plus
    # 300 min of agent plus 55 min of repair plus the packaging tail.
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      packages: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Record base commit
        run: git rev-parse HEAD > "${RUNNER_TEMP}/base-commit"

      # Pin the helper before the agent can modify the working tree. The agent may only touch
      # patch sources, but validation must never execute a script the agent could have edited.
      - name: Pin helper script
        run: cp .github/scripts/ai_patch.py "${RUNNER_TEMP}/ai_patch.py"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Cache the Gradle wrapper, dependencies and local build cache. The action only writes
      # on the default branch by default; this workflow runs on dev, so opt dev in as well.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # Pin one Python for the whole job. The image default (3.14) has no wheels for the
      # Pillow/lxml versions the analysis tools pull in, so pip compiles them from source
      # and fails without the jpeg headers. 3.12 has wheels for both.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Preparation only parses the issue and provides the URL/paths when the issue has
      # them. The agent finds a missing URL, resolves landing pages, downloads, validates
      # the size/type, and extracts the base APK.
      - name: Prepare issue and APK
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_BRIEF: ${{ secrets.AGENT_BRIEF }}
        run: python3 "${RUNNER_TEMP}/ai_patch.py" prepare

      # GitHub has no subtree-download endpoint and the repository tarball is several GB.
      # A tree:0 partial clone fetches refs only (sub-second) and then one pack for the
      # requested directories, which is the only fast way to get examplepatches alone.
      # The full examplepatches tree is ~390 MB across 20k+ files and stalls a checkout, so
      # fetch a small sample of complete, source-rich repos plus the app dirs this issue needs.
      # The archive has ~700 owners (285k files): a fixed sample contained zero files for every
      # app requested so far, so the fixed owners alone are only a general API reference.
      - name: Download reference example patches
        if: steps.prepare.outputs.mode == 'run'
        timeout-minutes: 8
        env:
          REF_REPO: https://github.com/rushiforai/morphe-archive.git
          REF_SUBDIR: examplepatches
          REF_OWNERS: 0xtalos Adiker AmpleReVanced
          APP_NAME: ${{ steps.prepare.outputs.app_name }}
          PACKAGE_NAME: ${{ steps.prepare.outputs.package_name }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          REPO_DIR="${RUNNER_TEMP}/morphe-archive"
          MATCHES="${RUNNER_TEMP}/reference-paths.txt"
          : > "$MATCHES"
          rm -rf "${REPO_DIR}"

          patterns=()
          for owner in ${REF_OWNERS}; do
            patterns+=("${REF_SUBDIR}/${owner}/*")
          done

          # Keyword matcher for the app in this issue: the package's distinctive segments and
          # the app name. Generic words are dropped so a keyword cannot select half the archive.
          keywords=$(
            printf '%s\n%s\n' "${PACKAGE_NAME:-}" "${APP_NAME:-}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -cs 'a-z0-9' '\n' \
              | awk 'length($0) >= 4' \
              | grep -vxE 'com|org|net|android|app|apps|apk|patch|patches|free|plus|premium|unlock|pro' \
              | sort -u | paste -sd'|' - || true
          )

          if timeout 60 git clone --depth 1 --filter=tree:0 --sparse --no-checkout \
              "${REF_REPO}" "${REPO_DIR}"; then
            # Listing the tree fetches tree objects only, no file contents: cheap enough to
            # select the few directories that mention this app before checking anything out.
            if [ -n "$keywords" ] \
               && timeout 120 git -C "${REPO_DIR}" ls-tree -r --name-only HEAD "${REF_SUBDIR}/" \
                    > "${RUNNER_TEMP}/reference-tree.txt" 2>/dev/null; then
              # A whole path component, not a substring: `proton` must not match ProtoNode.java
              # and `monet` must not match MonetizationPatch.kt.
              grep -iE "$keywords" "${RUNNER_TEMP}/reference-tree.txt" \
                | awk -F/ -v kw="^($keywords)$" '
                    { n = split($0, part, "/")
                      for (i = 1; i <= n; i++)
                        if (tolower(part[i]) ~ kw) { print; next } }' \
                | xargs -r -n 1 dirname | sort -u | head -n 40 > "$MATCHES" || true
            fi
            while read -r hit; do
              [ -n "$hit" ] && patterns+=("${hit}/*")
            done < "$MATCHES"

            if timeout 180 git -C "${REPO_DIR}" sparse-checkout set --no-cone "${patterns[@]}" \
               && timeout 180 git -C "${REPO_DIR}" checkout; then
              # Drop git metadata: this is read-only reference material, not a repository.
              rm -rf "${REPO_DIR}/.git"
              echo "EXAMPLE_PATCHES_DIR=${REPO_DIR}/${REF_SUBDIR}" >> "$GITHUB_ENV"
              echo "REFERENCE_MATCHES=${MATCHES}" >> "$GITHUB_ENV"
              echo "Reference patches: $(find "${REPO_DIR}/${REF_SUBDIR}" -type f | wc -l) files"
              echo "App-matching reference dirs for '${APP_NAME}': $(wc -l < "$MATCHES")"
            else
              rm -rf "${REPO_DIR}"
              echo "::warning::Could not download reference patches; continuing without them"
            fi
          else
            rm -rf "${REPO_DIR}"
            echo "::warning::Could not download reference patches; continuing without them"
          fi

      - name: Install analysis packages (apt)
        if: steps.prepare.outputs.mode == 'run'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ca-certificates curl git jq unzip zip wget ripgrep \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev \
            python3-dev python3-venv >/dev/null

      - name: Install decompilers and native tools
        if: steps.prepare.outputs.mode == 'run'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APKTOOL_VERSION=2.11.1
          curl -fsSL -o "${RUNNER_TEMP}/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          sudo mkdir -p /opt/apktool
          sudo mv "${RUNNER_TEMP}/apktool.jar" /opt/apktool/apktool.jar
          printf '#!/bin/sh\nexec java -jar /opt/apktool/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

          JADX_VERSION=1.5.1
          curl -fsSL -o "${RUNNER_TEMP}/jadx.zip" \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          sudo rm -rf /opt/jadx
          sudo mkdir -p /opt/jadx
          sudo unzip -q -o "${RUNNER_TEMP}/jadx.zip" -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx

          DEX2JAR_VERSION=2.4
          DEX2JAR_HOME="/opt/dex-tools-v${DEX2JAR_VERSION}"
          sudo rm -rf "${DEX2JAR_HOME}"
          curl -fsSL -o "${RUNNER_TEMP}/dex2jar.zip" \
            "https://github.com/pxb1988/dex2jar/releases/download/v${DEX2JAR_VERSION}/dex-tools-v${DEX2JAR_VERSION}.zip"
          sudo unzip -q -o "${RUNNER_TEMP}/dex2jar.zip" -d /opt
          sudo chmod +x "${DEX2JAR_HOME}"/*.sh
          sudo ln -sf "${DEX2JAR_HOME}/d2j-baksmali.sh" /usr/local/bin/baksmali
          sudo ln -sf "${DEX2JAR_HOME}/d2j-smali.sh" /usr/local/bin/smali
          sudo ln -sf "${DEX2JAR_HOME}/d2j-dex2jar.sh" /usr/local/bin/dex2jar
          sudo ln -sf "${DEX2JAR_HOME}/d2j-jar2dex.sh" /usr/local/bin/jar2dex
          echo "DEX2JAR_HOME=${DEX2JAR_HOME}" >> "$GITHUB_ENV"

          # Ghidra is large and optional: a failed download must not block the patch run.
          GHIDRA_VERSION=11.3.2
          GHIDRA_DATE=20250415
          GHIDRA_HOME="/opt/ghidra_${GHIDRA_VERSION}_PUBLIC"
          if [ ! -x "${GHIDRA_HOME}/ghidraRun" ]; then
            if curl -fsSL -o "${RUNNER_TEMP}/ghidra.zip" \
                "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"; then
              sudo unzip -q -o "${RUNNER_TEMP}/ghidra.zip" -d /opt
              rm -f "${RUNNER_TEMP}/ghidra.zip"
            else
              echo "::warning::Ghidra download failed; continuing without it"
            fi
          fi
          if [ -x "${GHIDRA_HOME}/ghidraRun" ]; then
            sudo ln -sf "${GHIDRA_HOME}/ghidraRun" /usr/local/bin/ghidra
            sudo ln -sf "${GHIDRA_HOME}/support/analyzeHeadless" /usr/local/bin/ghidra-headless
            echo "GHIDRA_HOME=${GHIDRA_HOME}" >> "$GITHUB_ENV"
          fi

          # Blutter is cloned only; it builds on first use when a Flutter app needs it.
          BLUTTER_HOME="${RUNNER_TEMP}/blutter"
          if [ ! -d "${BLUTTER_HOME}/.git" ]; then
            if timeout 120 git clone --depth 1 https://github.com/worawit/blutter.git "${BLUTTER_HOME}"; then
              :
            else
              echo "::warning::blutter clone failed; continuing without it"
              rm -rf "${BLUTTER_HOME}"
            fi
          fi
          if [ -d "${BLUTTER_HOME}" ]; then
            echo "BLUTTER_HOME=${BLUTTER_HOME}" >> "$GITHUB_ENV"
          fi

          # Morphe CLI is best effort: without it runtime verification is skipped. If it is present
          # but cannot apply the built patch, verification fails and publishing is blocked.
          ASSET=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" \
            | jq -r '[.assets[] | select(.name | test("-all\\.jar$")) | .browser_download_url][0] // empty' || true)
          if [ -n "${ASSET}" ]; then
            curl -fsSL -o "${RUNNER_TEMP}/morphe-cli.jar" "${ASSET}" || rm -f "${RUNNER_TEMP}/morphe-cli.jar"
          fi
          if [ ! -s "${RUNNER_TEMP}/morphe-cli.jar" ]; then
            echo "::warning::Morphe CLI could not be downloaded; runtime verification will be skipped"
          fi

      - name: Install Python analysis tools
        if: steps.prepare.outputs.mode == 'run'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP}/venv"
          python3 -m venv "${VENV}"

          # Guard the interpreter. apknife pins lxml==5.3.1, which ships no cp314 wheel, so a
          # venv on the image default (3.14) falls back to a source build and dies on libxml2 -
          # that is exactly how run 44986227483 lost apknife, droidlysis and hbctool.
          "${VENV}/bin/python" - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"venv python is {sys.version.split()[0]}, expected 3.12: lxml 5.3.1 has "
                  "no wheel for it and its source build fails without matching headers"
              )
          print(f"venv python {sys.version.split()[0]}")
          PY

          "${VENV}/bin/pip" install --upgrade pip >/dev/null

          # Pillow and lxml are hard requirements: the analysis tools import them, and the
          # agent needs Pillow to read the app icon colour. Install the exact versions apknife
          # pins, wheels only, so pip never falls back to a source build on the runner. Both
          # pins ship cp312 manylinux wheels; their source builds fail against the runner GCC
          # (run 44964583951: "Failed building wheel for lxml" / "for Pillow").
          "${VENV}/bin/pip" install --no-cache-dir --only-binary=:all: \
            "lxml==5.3.1" "Pillow==11.1.0"

          # --only-binary applies to every package in the command, so the plain tools get
          # their own call: distinguishing the solver here would also forbid their
          # sdist-only transitive dependencies.
          "${VENV}/bin/pip" install --no-cache-dir \
            androguard apkid capstone pyelftools requests

          # apkutils2 publishes no wheel; it is pure Python, so its sdist build is safe.
          "${VENV}/bin/pip" install --no-cache-dir apkutils2

          # No `|| echo` fallback: swallowing this failure left the agent with a reduced
          # toolchain and a green step, which is how apknife, hbctool and droidlysis went
          # missing in 7 of 22 runs. If it breaks, the step and the job fail.
          "${VENV}/bin/pip" install --no-cache-dir \
            hermes-dec apksigcopier apksigtool droidlysis apknife hbctool

          # Download helpers the agent used to install for itself mid-run (45071051087:
          # cloudscraper, playwright, curl_cffi). Having them up front keeps a patch run from
          # depending on network installs while it works. Playwright drives the image's Chrome
          # through executable_path, so no bundled browser download is needed.
          "${VENV}/bin/pip" install --no-cache-dir \
            cloudscraper curl_cffi playwright

          # Assert every tool is really present, so a partial install cannot pass unnoticed.
          # pip show is name-based, so it covers packages whose module name differs.
          missing=""
          for pkg in androguard apkid capstone pyelftools requests lxml Pillow \
                     apkutils2 hermes-dec apksigcopier apksigtool droidlysis apknife hbctool \
                     cloudscraper curl_cffi playwright; do
            "${VENV}/bin/pip" show "$pkg" >/dev/null 2>&1 || missing="${missing} ${pkg}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Python analysis tools missing after install:${missing}"
            exit 1
          fi

          # Fail setup here, not five minutes into the agent, if the venv lost either module.
          "${VENV}/bin/python" -c \
            "import PIL, lxml.etree; print('Pillow', PIL.__version__, 'lxml', lxml.etree.__version__)"
          echo "${VENV}/bin" >> "$GITHUB_PATH"

      # FlareSolverr drives a real, patched Chromium through Cloudflare's "Just a moment..."
      # interstitial, which answered 403 to every plain HTTP client in run 45071051087:
      # cloudscraper, curl_cffi (chrome110/120/124, safari17) and headless Playwright all got
      # the challenge page from apkpure, apkcombo, apkfab, apkpure.net, apkgk and apktoy.
      # Best effort on purpose: patch generation does not depend on it, so a mirror that blocks
      # the service must not fail an otherwise good run.
      - name: Start FlareSolverr
        id: flaresolverr
        if: steps.prepare.outputs.mode == 'run'
        timeout-minutes: 5
        run: |
          set -uo pipefail

          # Pinned: the Linux release is a self-contained PyInstaller bundle with its own Chromium.
          VERSION=3.5.2
          DIR="${RUNNER_TEMP}/flaresolverr"
          TAR="${RUNNER_TEMP}/flaresolverr.tar.gz"
          LOG="${RUNNER_TEMP}/flaresolverr.log"

          if ! curl -fsSL --retry 3 -o "$TAR" \
              "https://github.com/FlareSolverr/FlareSolverr/releases/download/v${VERSION}/flaresolverr_linux_x64.tar.gz"; then
            echo "::warning::FlareSolverr download failed; falling back to cloudscraper/curl_cffi"
            exit 0
          fi

          mkdir -p "$DIR"
          if ! tar -xzf "$TAR" -C "$DIR"; then
            echo "::warning::FlareSolverr archive could not be extracted; falling back"
            exit 0
          fi
          BIN=$(find "$DIR" -maxdepth 2 -type f -name 'flaresolverr*' -perm -u+x | head -n1)
          if [ -z "${BIN:-}" ]; then
            echo "::warning::FlareSolverr binary not found in the archive; falling back"
            exit 0
          fi
          chmod +x "$BIN"

          ( cd "$DIR" && HEADLESS=true LOG_LEVEL=info "$BIN" >"$LOG" 2>&1 ) &
          echo "$!" > "${RUNNER_TEMP}/flaresolverr.pid"

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 -X POST http://127.0.0.1:8191/v1 \
                 -H 'Content-Type: application/json' \
                 -d '{"cmd":"sessions.list"}' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::warning::FlareSolverr did not start; falling back to cloudscraper/curl_cffi"
            tail -n 20 "$LOG" 2>/dev/null || true
            exit 0
          fi

          # Prove it renders a page, not merely answers HTTP, before advertising it to the agent.
          smoke=$(curl -sS --max-time 90 -X POST http://127.0.0.1:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://example.com","maxTimeout":60000}')
          if printf '%s' "$smoke" | grep -q '"status": *200'; then
            echo "FLARESOLVERR_URL=http://127.0.0.1:8191" >> "$GITHUB_ENV"
            echo "FlareSolverr ready and serving pages"
          else
            echo "::warning::FlareSolverr answered but could not fetch a test page; falling back"
            printf '%s' "$smoke" | head -c 600 || true
          fi

      - name: Install Codex CLI
        if: steps.prepare.outputs.mode == 'run'
        run: |
          set -euo pipefail
          # Codex 0.95.0 dropped Chat Completions support: `wire_api = "chat"` is a hard error
          # now and every request goes to /responses. The configured gateway only implements
          # /v1/chat/completions, so pin the last release that can still talk to it.
          npm install --global @openai/codex@0.94.0
          codex --version

      - name: Configure AI agent
        if: steps.prepare.outputs.mode == 'run'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://tokenharbor.ai/v1' }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail

          : "${AI_API_KEY:?Set the AI_API_KEY repository secret}"
          : "${AI_MODEL:?Set the AI_MODEL repository secret}"

          case "${AI_BASE_URL}" in
            http://*|https://*) ;;
            *) AI_BASE_URL="https://${AI_BASE_URL}" ;;
          esac

          # Codex appends /chat/completions itself, so base_url must be the API root.
          # Tolerate a pasted docs page (…/docs) or a bare host and normalise both to /v1.
          while [ "${AI_BASE_URL}" != "${AI_BASE_URL%/}" ]; do
            AI_BASE_URL="${AI_BASE_URL%/}"
          done
          case "${AI_BASE_URL}" in
            */docs) AI_BASE_URL="${AI_BASE_URL%/docs}/v1" ;;
          esac
          case "${AI_BASE_URL#*://}" in
            */*) ;;
            *) AI_BASE_URL="${AI_BASE_URL}/v1" ;;
          esac

          mkdir -p "${CODEX_HOME}"
          cat > "${CODEX_HOME}/config.toml" <<EOF
          model = "${AI_MODEL}"
          model_provider = "patch-gateway"
          # Pin effort and verbosity: unset, they follow the gateway's model default, which
          # made turns drift between 10s and 104s. `low` is the faster setting; `medium`
          # keeps the patch quality this pipeline needs.
          model_reasoning_effort = "medium"
          model_verbosity = "medium"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"

          [model_providers.patch-gateway]
          name = "Patch gateway"
          base_url = "${AI_BASE_URL}"
          wire_api = "chat"
          env_key = "AI_GATEWAY_API_KEY"

          [shell_environment_policy.filters]
          AI_GATEWAY_API_KEY = "exclude"
          EOF

          # Speed rules. The 2026-11-22 run spent 52 of its 56 minutes waiting on model turns:
          # every extra round trip costs ~30s, and a growing transcript makes later turns slower.
          cat >> "${RUNNER_TEMP}/task.md" <<EOF

          ## Working rules (CI)

          - Batch shell work. Write one script per phase and run it once. Never spend a turn on a
            single grep, ls, cat or file read that the previous command could have covered.
          - Decompile exactly once, straight after the base APK exists, into ${RUNNER_TEMP}/decompiled:
            apktool d -f -o "${RUNNER_TEMP}/decompiled" "${RUNNER_TEMP}/input/base.apk". Every later
            search and check reads that tree (DECOMPILED_DIR points there too). Never run "apktool d"
            a second time and never unpack to another directory.
          - Never print file contents or full directory listings. Print counts, paths, and only the
            few lines you are reasoning about.
          - Do not re-verify your own patch by decompiling a second time. The workflow runs its own
            verification after you finish; stop as soon as the patch builds and applies.
          - Before writing patch code, read at least two reference patches for this app in one
            batched command: the paths in `$REFERENCE_MATCHES` first, since they are matched to
            this issue's app, then `$EXAMPLE_PATCHES_DIR` for general API style. Skip the step
            only when both are unset or empty.

          ## Git commit rules

          For every git commit you create, follow these rules:

          - Every commit message must include the author attribution:

            Co-authored-by: Claude <claude@anthropic.com>
          EOF

          # Quoted heredoc: $FLARESOLVERR_URL must reach the agent as a variable to read at run
          # time, not be expanded (and emptied) while the prompt is written.
          cat >> "${RUNNER_TEMP}/task.md" <<'EOF'

          ## Network access in CI

          - Never install packages at runtime; this wins over older brief text that permits it.
            `cloudscraper`, `curl_cffi` and `playwright` are already in the venv, and so are the
            analysis tools. Chrome and Chromium are at /usr/bin/google-chrome and
            /usr/bin/chromium; pass that to Playwright as `executable_path` (its bundled
            browsers are not downloaded).
          - Try the cheapest source first: a direct GitHub release asset, then the vendor's own
            API or CDN, then an APK mirror.
          - If a mirror answers 403 with a "Just a moment..." Cloudflare page, ask FlareSolverr
            (`$FLARESOLVERR_URL`, normally http://127.0.0.1:8191):

                curl -sS -X POST "$FLARESOLVERR_URL/v1" -H 'Content-Type: application/json' \
                  -d '{"cmd":"request.get","url":"<page>","maxTimeout":120000}'

            Read `solution.status`, `solution.response` and `solution.cookies` from the JSON.
            For a multi-step flow (app page, then download page, then file) call
            `{"cmd":"sessions.create"}` once, pass that `session` to every `request.get`, and
            `sessions.destroy` when done. If the page shows a Turnstile widget, retry with
            `"tabs_till_verify": 2`.
          - A `cf_clearance` cookie only works with the User-Agent that solved it. Send
            `solution.headers["user-agent"]` as the UA on every follow-up request, including
            curl_cffi's `impersonate` and cloudscraper's browser map, or the mirror answers 403
            again.
          - If FlareSolverr is unset or fails, fall back to `curl_cffi` with
            `impersonate="chrome"`, then `cloudscraper`, then Playwright on system Chrome.
            Report a blocked mirror instead of guessing at paid or third-party download links.
          - App files come only from APKMirror, Uptodown, APKPure, APKCube, or the app's
            original GitHub repository when it is open source. Any other host is a hard
            stop: never download from it and never patch a build you got elsewhere.
          EOF

          # CI autonomy override. The brief is already in task.md; no separate AGENTS.md is created.
          # Keep this last so it wins if an earlier instruction mentions asking for confirmation.
          cat >> "${RUNNER_TEMP}/task.md" <<'EOF'

          ## CI autonomy override

          There is no human available during this run. Never ask a question, request confirmation, or
          wait for a user reply. Do not end with "Should I proceed?" or a plan. If a build or Morphe CLI
          apply fails, diagnose it, fix the patch, rebuild, and retry until it applies or you have a
          concrete blocker. Ignore any earlier instruction that asks for confirmation.
          EOF

      - name: Run AI agent
        id: agent
        if: steps.prepare.outputs.mode == 'run'
        # A failed or question-only run must not stop the job: the repair step below gets a
        # chance to fix the working tree, rebuild and re-apply.
        continue-on-error: true
        # As much as the 360-minute job cap leaves after setup and repair: a hard patch that
        # needs many model turns must never be killed mid-thought.
        timeout-minutes: 300
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          MORPHE_CLI: ${{ runner.temp }}/morphe-cli.jar
          APK_URL: ${{ steps.prepare.outputs.apk_url }}
          APK_PATH: ${{ steps.prepare.outputs.apk_path }}
          BASE_APK_PATH: ${{ steps.prepare.outputs.base_apk_path }}
          DECOMPILED_DIR: ${{ runner.temp }}/decompiled
          AGENT_BRIEF_DIR: ${{ runner.temp }}/brief
        run: |
          set -uo pipefail

          # Codex echoes its prompt, which contains the private run brief. The transcript is
          # never printed raw: it goes through stream_agent_log.py, which drops every line that
          # matches the brief, and the full copy stays in runner temp.
          LOG="${RUNNER_TEMP}/agent-output.log"
          TASK_SNAPSHOT="${RUNNER_TEMP}/task-private-scan.md"
          : > "$LOG"
          # The prompt no longer carries the brief, so the sanitizer reads the private bundle
          # prepare wrote; fall back to the task file if an older prepare did not write one.
          cp "${RUNNER_TEMP}/private-scan.md" "$TASK_SNAPSHOT" 2>/dev/null \
            || cp "${RUNNER_TEMP}/task.md" "$TASK_SNAPSHOT" 2>/dev/null || true

          # Always stream. A step that prints nothing for an hour looks hung and gets
          # cancelled, which is exactly what happened before: the transcript stayed in
          # runner temp and the whole run was lost as a result. stream_agent_log.py drops
          # every line that matches the private brief, and the heartbeat keeps the log
          # alive while codex is thinking instead of printing.
          # A wedged Codex must not burn the step budget. Run 44986227483 printed nothing for
          # 52 minutes, made zero tool calls, then exited 1, and the repair step idled for its
          # whole 60-minute cap afterwards. Kill the process as soon as it stops progressing.
          STREAM="${RUNNER_TEMP}/agent-stream.log"
          STALL_LIMIT="${AGENT_STALL_LIMIT:-900}"
          FIRST_TOOL_LIMIT="${AGENT_FIRST_TOOL_LIMIT:-900}"
          WATCH_INTERVAL="${AGENT_WATCH_INTERVAL:-30}"
          : > "$STREAM"

          start=$(date +%s)
          codex exec \
            --sandbox danger-full-access \
            --skip-git-repo-check \
            --model "${AI_MODEL}" \
            --output-last-message "${RUNNER_TEMP}/agent-message.md" \
            - < "${RUNNER_TEMP}/task.md" > "$LOG" 2>&1 &
          codex_pid=$!

          # Show progress while it runs. The sanitized copy is kept so a failure can be
          # diagnosed from the run's artifacts instead of an empty log.
          tail -n +1 -F "$LOG" --pid="$codex_pid" 2>/dev/null \
            | python3 -u "${GITHUB_WORKSPACE}/.github/scripts/stream_agent_log.py" "$TASK_SNAPSHOT" \
            | tee -a "$STREAM" &
          stream_pid=$!

          acted=0
          stalled=""
          last=-1
          stall=0
          while kill -0 "$codex_pid" 2>/dev/null; do
            sleep "$WATCH_INTERVAL"
            size=$(wc -c < "$LOG" 2>/dev/null || echo 0)
            if [ "$size" -eq "$last" ]; then stall=$((stall + WATCH_INTERVAL)); else stall=0; last=$size; fi
            if grep -qE '^(exec|apply_patch)$' "$LOG" 2>/dev/null; then acted=1; fi
            echo "::notice::agent running: $(( $(date +%s) - start ))s elapsed, $(( size / 1024 )) KB output, ${stall}s stale, tool calls: $([ "$acted" -eq 1 ] && echo yes || echo no)"
            if [ "$stall" -ge "$STALL_LIMIT" ]; then
              stalled="no new output for ${stall}s"
              break
            fi
            if [ "$acted" -eq 0 ] && [ $(( $(date +%s) - start )) -ge "$FIRST_TOOL_LIMIT" ]; then
              stalled="no tool call in ${FIRST_TOOL_LIMIT}s"
              break
            fi
          done

          if [ -n "$stalled" ]; then
            echo "::error::Agent wedged (${stalled}); killing it instead of waiting for the step timeout."
            kill -TERM "$codex_pid" 2>/dev/null || true
            sleep 5
            kill -KILL "$codex_pid" 2>/dev/null || true
          fi

          # `bash -e` is the step shell: a bare `wait` on a killed child would abort the
          # script here and skip the outputs below.
          status=0
          wait "$codex_pid" 2>/dev/null || status=$?
          if [ -n "$stalled" ]; then status=1; fi
          sleep 2
          kill "$stream_pid" 2>/dev/null || true

          echo "Codex exited with status ${status}. Full output is in the runner temp directory."
          python3 - "$LOG" "$TASK_SNAPSHOT" <<'PY' || true
          import os
          import re
          import sys
          from collections import deque
          from pathlib import Path

          log_path, task_path = sys.argv[1:3]
          ansi = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")
          safe_line = re.compile(
              r"^(?:-{3,}|"
              r"(?:model|provider|approval|sandbox|workdir|reasoning effort|session|tokens used)\b|"
              r"(?:error|warning|fatal|failure)\b|"
              r"(?:codex exited|process exited|exit code)\b)",
              re.IGNORECASE,
          )
          secret_keys = (
              "AI_GATEWAY_API_KEY",
              "GITHUB_TOKEN",
          )
          secrets = [
              os.environ[key]
              for key in secret_keys
              if len(os.environ.get(key, "")) >= 8
          ]

          private = ""
          task = Path(task_path)
          if task.is_file():
              text = task.read_text(encoding="utf-8", errors="replace")
              brief_start = "<!-- agent-brief:start -->"
              brief_end = "<!-- agent-brief:end -->"
              if brief_start in text and brief_end in text:
                  private += "\n" + text.split(brief_start, 1)[1].split(brief_end, 1)[0]

          private_lines = {
              re.sub(r"\s+", " ", line).strip().lower()
              for line in private.splitlines()
              if len(line.strip()) >= 12
          }
          private_ngrams = set()
          for line in private_lines:
              words = re.findall(r"[a-z0-9]+", line)
              for index in range(len(words) - 2):
                  private_ngrams.add(" ".join(words[index:index + 3]))
          private_tokens = {
              token.lower()
              for token in re.findall(r"[A-Za-z0-9_\-]{6,}", private)
          }
          private_tokens.update(
              token.lower()
              for token in re.findall(r"\b[A-Z][A-Z0-9_\-]{2,}\b", private)
          )

          def sanitize(value: str) -> str:
              value = ansi.sub("", value).replace("\r", "")
              for secret in secrets:
                  value = value.replace(secret, "[REDACTED]")
              value = re.sub(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b", "[REDACTED]", value)
              value = re.sub(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b", "[REDACTED]", value)
              value = re.sub(r"\bsk-[A-Za-z0-9]{20,}\b", "[REDACTED]", value)
              value = re.sub(
                  r"(?i)\b(api[_-]?key|token|secret|password)\s*[:=]\s*\S+",
                  r"\1=[REDACTED]",
                  value,
              )
              return value[:300]

          lines = deque(maxlen=200)
          try:
              with open(log_path, encoding="utf-8", errors="replace") as handle:
                  for raw in handle:
                      lines.append(raw.rstrip("\n"))
          except FileNotFoundError:
              pass

          tail = []
          for raw in lines:
              line = sanitize(raw).strip()
              if not line or not safe_line.match(line):
                  continue
              normalized = re.sub(r"\s+", " ", line).lower()
              if any(item in normalized for item in private_lines):
                  continue
              if any(ngram in normalized for ngram in private_ngrams):
                  continue
              if private_tokens & set(re.findall(r"[a-z0-9_\-]{6,}", normalized)):
                  continue
              tail.append(line)

          if tail:
              print("--- sanitized agent output tail ---")
              for line in tail[-15:]:
                  print(line)
          else:
              print("--- no safe agent output lines to display ---")
          PY

          # A failed run that never called a tool and changed nothing cannot be repaired:
          # retrying it just idles for another block of the step budget.
          if grep -qE '^(exec|apply_patch)$' "$LOG" 2>/dev/null; then acted=1; fi
          changes=$(git status --porcelain -uall 2>/dev/null | wc -l)
          if [ "$status" -ne 0 ] && [ "$acted" -eq 0 ] && [ "$changes" -eq 0 ]; then
            echo "acted=no" >> "$GITHUB_OUTPUT"
            echo "::error::The agent never acted (exit ${status}, no tool calls, no file changes); skipping repair."
          else
            echo "acted=yes" >> "$GITHUB_OUTPUT"
          fi

          exit "$status"

      - name: Validate generated changes
        id: validate_changes
        if: steps.prepare.outputs.mode == 'run' && steps.agent.outcome == 'success'
        # Keep going so the repair step can fix validation/build/apply failures.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 "${RUNNER_TEMP}/ai_patch.py" validate 2>&1 | tee "${RUNNER_TEMP}/validate.log"

      - name: Build patch bundle
        id: build_bundle
        if: steps.prepare.outputs.mode == 'run' && steps.validate_changes.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew :patches:buildAndroid --no-daemon 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Verify patch against the APK
        id: verify_patch
        if: steps.prepare.outputs.mode == 'run' && steps.build_bundle.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.prepare.outputs.apk_path }}
          MORPHE_CLI: ${{ runner.temp }}/morphe-cli.jar
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/ai_patch.py" verify
          STATUS=$(cut -d'|' -f1 "${RUNNER_TEMP}/verify-status" 2>/dev/null || true)
          case "$STATUS" in
            verified|skipped) ;;
            *)
              echo "::error::Morphe CLI verification did not succeed (status: ${STATUS:-missing})"
              exit 1
              ;;
          esac
          echo "Verification status: ${STATUS}"

      - name: Repair patch after failed verification
        if: |
          steps.prepare.outputs.mode == 'run' &&
          steps.agent.outputs.acted != 'no' &&
          (steps.agent.outcome == 'failure' ||
           steps.validate_changes.outcome == 'failure' ||
           steps.build_bundle.outcome == 'failure' ||
           steps.verify_patch.outcome == 'failure')
        # 2 attempts x 20 min plus the validate/build/verify tail, inside the job cap. Each
        # attempt is also killed early when it stops making progress (see the watchdog below).
        timeout-minutes: 55
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          MORPHE_CLI: ${{ runner.temp }}/morphe-cli.jar
          APK_URL: ${{ steps.prepare.outputs.apk_url }}
          APK_PATH: ${{ steps.prepare.outputs.apk_path }}
          BASE_APK_PATH: ${{ steps.prepare.outputs.base_apk_path }}
          AGENT_BRIEF_DIR: ${{ runner.temp }}/brief
          INITIAL_AGENT_OUTCOME: ${{ steps.agent.outcome }}
          INITIAL_VALIDATE_OUTCOME: ${{ steps.validate_changes.outcome }}
          INITIAL_BUILD_OUTCOME: ${{ steps.build_bundle.outcome }}
          INITIAL_VERIFY_OUTCOME: ${{ steps.verify_patch.outcome }}
        run: |
          set -uo pipefail

          # No user can answer questions mid-run. Feed the failure back to the agent and make it
          # repair the existing working tree, rebuild, and re-apply. Codex output stays in
          # runner temp because its prompt contains the private run brief.
          INITIAL_STAGE="the initial attempt"
          INITIAL_LOG=""
          if [ "${INITIAL_AGENT_OUTCOME}" = "failure" ]; then
            INITIAL_STAGE="the initial agent run"
          elif [ "${INITIAL_VALIDATE_OUTCOME}" = "failure" ]; then
            INITIAL_STAGE="validation"
            INITIAL_LOG="${RUNNER_TEMP}/validate.log"
          elif [ "${INITIAL_BUILD_OUTCOME}" = "failure" ]; then
            INITIAL_STAGE="the Gradle build"
            INITIAL_LOG="${RUNNER_TEMP}/build.log"
          elif [ "${INITIAL_VERIFY_OUTCOME}" = "failure" ]; then
            INITIAL_STAGE="Morphe CLI apply"
            INITIAL_LOG="${RUNNER_TEMP}/verify.log"
          fi

          # Progress, not just wall clock: the main agent kills a wedged Codex well before its
          # step timeout, and repair needs the same signal. Defaults match the main agent.
          STALL_LIMIT="${AGENT_STALL_LIMIT:-900}"
          FIRST_TOOL_LIMIT="${AGENT_FIRST_TOOL_LIMIT:-900}"
          WATCH_INTERVAL="${AGENT_WATCH_INTERVAL:-30}"
          # Two capped attempts plus the validate/build/verify tail stay inside the 55-minute step.
          ATTEMPT_CAP="${REPAIR_ATTEMPT_CAP:-1200}"
          # Do not start attempt 2 unless roughly another capped attempt still fits the step.
          SECOND_ATTEMPT_AFTER="${REPAIR_SECOND_ATTEMPT_AFTER:-2100}"
          script_start=$(date +%s)

          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              used=$(( $(date +%s) - script_start ))
              if [ "$used" -ge "$SECOND_ATTEMPT_AFTER" ]; then
                echo "::error::Repair attempt 1 used ${used}s of the step budget; not starting a second attempt."
                exit 1
              fi
            fi
            echo "Automatic repair attempt ${attempt} after ${INITIAL_STAGE} failed."
            cp "${RUNNER_TEMP}/task.md" "${RUNNER_TEMP}/repair-task.md"
            {
              echo ""
              echo "## Automatic repair attempt ${attempt}"
              echo ""
              echo "Nobody can answer questions during this run. Do not ask for confirmation,"
              echo "do not ask \"should I proceed?\", and do not wait for a user reply."
              echo "The previous attempt failed at ${INITIAL_STAGE}. Fix the existing changes"
              echo "in the working tree, rebuild, and re-apply the patch with Morphe CLI. Retry"
              echo "on your own until it applies cleanly or you have a concrete blocker."
              echo "If the APK is missing at ${APK_PATH:-${RUNNER_TEMP}/input/app.apk}, download it"
              echo "from ${APK_URL:-the issue URL} and extract the base APK to"
              echo "${BASE_APK_PATH:-${RUNNER_TEMP}/input/base.apk} before rebuilding."
              echo ""
              if [ -n "${INITIAL_LOG}" ] && [ -f "${INITIAL_LOG}" ]; then
                echo "### Failure output"
                echo ""
                tail -c 12000 "${INITIAL_LOG}" || true
                echo ""
              fi
            } >> "${RUNNER_TEMP}/repair-task.md"

            # Same live stream as the main agent: a repair attempt can run for 30+ minutes with
            # no output, which looks hung and gets cancelled. The prompt carries the private
            # brief, so the raw transcript stays in runner temp and only sanitized lines print.
            CODEX_LOG="${RUNNER_TEMP}/repair-${attempt}-codex.log"
            REPAIR_SNAPSHOT="${RUNNER_TEMP}/repair-${attempt}-private-scan.md"
            : > "$CODEX_LOG"
            cp "${RUNNER_TEMP}/private-scan.md" "$REPAIR_SNAPSHOT" 2>/dev/null \
              || cp "${RUNNER_TEMP}/repair-task.md" "$REPAIR_SNAPSHOT" 2>/dev/null || true
            # Same watchdog shape as the main agent: sample the log every interval, and kill a
            # Codex that stops growing or never calls a tool. Without it a wedged attempt sat
            # on its whole cap (45071051087, 45054806897) or the entire step timeout
            # (44986227483; 45027445435 attempt 1 ran 57 minutes and printed one line).
            start=$(date +%s)
            REPAIR_STREAM="${RUNNER_TEMP}/repair-${attempt}-stream.log"
            : > "$REPAIR_STREAM"
            acted=0
            stalled=""
            last=-1
            stall=0
            codex exec \
              --sandbox danger-full-access \
              --skip-git-repo-check \
              --model "${AI_MODEL}" \
              --output-last-message "${RUNNER_TEMP}/repair-message-${attempt}.md" \
              - < "${RUNNER_TEMP}/repair-task.md" > "$CODEX_LOG" 2>&1 &
            codex_pid=$!

            tail -n +1 -F "$CODEX_LOG" --pid="$codex_pid" 2>/dev/null \
              | python3 -u "${GITHUB_WORKSPACE}/.github/scripts/stream_agent_log.py" "$REPAIR_SNAPSHOT" \
              | tee -a "$REPAIR_STREAM" &
            stream_pid=$!

            while kill -0 "$codex_pid" 2>/dev/null; do
              sleep "$WATCH_INTERVAL"
              elapsed=$(( $(date +%s) - start ))
              size=$(wc -c < "$CODEX_LOG" 2>/dev/null || echo 0)
              if [ "$size" -eq "$last" ]; then stall=$((stall + WATCH_INTERVAL)); else stall=0; last=$size; fi
              if grep -qE '^(exec|apply_patch)$' "$CODEX_LOG" 2>/dev/null; then acted=1; fi
              echo "::notice::repair attempt ${attempt} running: ${elapsed}s elapsed, $(( size / 1024 )) KB output, ${stall}s stale, tool calls: $([ "$acted" -eq 1 ] && echo yes || echo no)"
              # The gateway rejects an over-long conversation, and Codex then retries the same
              # too-large request: no amount of waiting recovers from that (45054806897).
              if grep -q 'maximum context length' "$CODEX_LOG" 2>/dev/null; then
                stalled="the model context limit was exceeded"
                break
              fi
              if [ "$stall" -ge "$STALL_LIMIT" ]; then
                stalled="no new output for ${stall}s"
                break
              fi
              if [ "$acted" -eq 0 ] && [ "$elapsed" -ge "$FIRST_TOOL_LIMIT" ]; then
                stalled="no tool call in ${FIRST_TOOL_LIMIT}s"
                break
              fi
              if [ "$elapsed" -ge "$ATTEMPT_CAP" ]; then
                stalled="the ${ATTEMPT_CAP}s attempt cap"
                break
              fi
            done

            if [ -n "$stalled" ]; then
              echo "::warning::Repair attempt ${attempt} wedged (${stalled}); killing it instead of waiting it out."
              kill -TERM "$codex_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$codex_pid" 2>/dev/null || true
            fi

            codex_status=0
            wait "$codex_pid" 2>/dev/null || codex_status=$?
            [ -n "$stalled" ] && codex_status=124
            sleep 2
            kill "$stream_pid" 2>/dev/null || true
            echo "Repair Codex attempt ${attempt} exited with status ${codex_status} after $(( $(date +%s) - start ))s."

            if [ "$codex_status" = "124" ] || [ -n "$stalled" ]; then
              # A killed attempt cannot have produced a valid tree, so its validation is wasted
              # time. If the first attempt never called a tool, a second identical attempt would
              # wedge the same way (44986227483, 45027445435).
              if [ "$attempt" -eq 1 ] && [ "$acted" -eq 0 ]; then
                echo "::error::Repair attempt 1 never called a tool (${stalled:-exit 124}); a second attempt would wedge the same way."
                exit 1
              fi
              echo "::warning::Skipping validation for repair attempt ${attempt}: the agent was stopped before finishing."
              INITIAL_STAGE="the stopped repair attempt ${attempt}"
              INITIAL_LOG=""
              continue
            fi

            VALIDATE_LOG="${RUNNER_TEMP}/repair-${attempt}-validate.log"
            BUILD_LOG="${RUNNER_TEMP}/repair-${attempt}-build.log"
            VERIFY_STEP_LOG="${RUNNER_TEMP}/repair-${attempt}-verify.log"
            INITIAL_STAGE=""
            INITIAL_LOG=""

            if ! python3 "${RUNNER_TEMP}/ai_patch.py" validate > "$VALIDATE_LOG" 2>&1; then
              INITIAL_STAGE="validation"
              INITIAL_LOG="$VALIDATE_LOG"
            elif ! ./gradlew :patches:buildAndroid --no-daemon > "$BUILD_LOG" 2>&1; then
              INITIAL_STAGE="the Gradle build"
              INITIAL_LOG="$BUILD_LOG"
            elif ! python3 "${RUNNER_TEMP}/ai_patch.py" verify > "$VERIFY_STEP_LOG" 2>&1; then
              INITIAL_STAGE="Morphe CLI apply"
              INITIAL_LOG="${RUNNER_TEMP}/verify.log"
            else
              echo "Repair attempt ${attempt} built and applied successfully."
              exit 0
            fi

            echo "::warning::Repair attempt ${attempt} failed at ${INITIAL_STAGE}."
            if [ -n "${INITIAL_LOG}" ] && [ -f "${INITIAL_LOG}" ]; then
              tail -n 20 "${INITIAL_LOG}" || true
            fi
          done

          echo "::error::Automatic repair attempts did not produce a patch that applies."
          exit 1

      - name: Package result
        if: always() && steps.prepare.outputs.mode == 'run'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ai-patch-result"

          git add -N -- patches/src extensions/extension/src 2>/dev/null || true
          git diff --binary -- patches/src extensions/extension/src > "${RUNNER_TEMP}/ai-patch-result/agent.patch" || true

          for file in issue.json verify-status prepare-error.txt; do
            if [ -f "${RUNNER_TEMP}/${file}" ]; then
              cp "${RUNNER_TEMP}/${file}" "${RUNNER_TEMP}/ai-patch-result/${file}"
            fi
          done
          if [ -f "${RUNNER_TEMP}/verify.log" ]; then
            tail -c 100000 "${RUNNER_TEMP}/verify.log" > "${RUNNER_TEMP}/ai-patch-result/verify.log" || true
          fi
          # Sanitized agent transcript: already stripped of the private brief, so a failed run
          # can be diagnosed from the artifact instead of an empty log.
          if [ -f "${RUNNER_TEMP}/agent-stream.log" ]; then
            tail -c 200000 "${RUNNER_TEMP}/agent-stream.log" > "${RUNNER_TEMP}/ai-patch-result/agent-stream.log" || true
          fi

      - name: Upload result
        if: always() && steps.prepare.outputs.mode == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: ai-patch-result
          path: ${{ runner.temp }}/ai-patch-result
          retention-days: 7
          if-no-files-found: ignore

      # The runtime-verified APK, so a tester can install what the run produced without
      # rebuilding the .mpp. GitHub always wraps artifacts in a zip; there is no raw-file URL.
      - name: Collect patched APK
        id: collect_apk
        if: always() && steps.prepare.outputs.mode == 'run'
        run: |
          set -uo pipefail
          STATUS=$(cut -d'|' -f1 "${RUNNER_TEMP}/verify-status" 2>/dev/null || true)
          if [ "$STATUS" != "verified" ]; then
            echo "Verification status is '${STATUS:-missing}'; no patched APK to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Morphe CLI writes its output next to the input APK or into its own working
          # directory depending on the build, so take the newest APK that is not an input.
          PATCHED=$(find "${RUNNER_TEMP}" -maxdepth 3 -type f -name '*.apk' \
            ! -path "${RUNNER_TEMP}/input/app.apk" \
            ! -path "${RUNNER_TEMP}/input/base.apk" \
            -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "${PATCHED:-}" ] || [ ! -s "$PATCHED" ]; then
            echo "::warning::Verification passed but no patched APK was found on the runner."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_NAME=$(jq -r '.app_name // "app"' "${RUNNER_TEMP}/issue.json" 2>/dev/null \
            | tr -d '\r\n' | sed 's/[^A-Za-z0-9._-]/_/g' | cut -c1-40)
          [ -n "${APP_NAME}" ] || APP_NAME="app"
          mkdir -p "${RUNNER_TEMP}/ai-patch-apk"
          ASSET="${APP_NAME}-issue-${ISSUE_NUMBER}-patched.apk"
          cp "$PATCHED" "${RUNNER_TEMP}/ai-patch-apk/${ASSET}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Collected ${ASSET} ($(du -h "$PATCHED" | cut -f1))"

      - name: Upload patched APK
        if: always() && steps.collect_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          # `archive: false` stores the file as-is, so the artifact on the run page is the .apk
          # itself rather than a zip. Only one file can be uploaded this way, and the file's
          # name becomes the artifact name (`name` is ignored).
          path: ${{ runner.temp }}/ai-patch-apk/*.apk
          archive: false
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish patch
    needs: agent
    if: success() && needs.agent.outputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      actions: write
      packages: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      # Trusted copy: the artifact is applied after this, so it cannot replace the validator.
      - name: Pin helper script
        run: cp .github/scripts/ai_patch.py "${RUNNER_TEMP}/ai_patch.py"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Same Gradle cache as the agent job: this job's bundle build starts cold otherwise.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: ai-patch-result
          path: ${{ runner.temp }}/ai-patch-result

      - name: Apply generated patch
        run: |
          set -euo pipefail
          PATCH_FILE="${RUNNER_TEMP}/ai-patch-result/agent.patch"
          if [ ! -s "${PATCH_FILE}" ]; then
            echo "::error::The agent produced no changes to publish"
            exit 1
          fi
          git apply --binary --whitespace=nowarn "${PATCH_FILE}"

          for file in issue.json verify-status verify.log; do
            if [ -f "${RUNNER_TEMP}/ai-patch-result/${file}" ]; then
              cp "${RUNNER_TEMP}/ai-patch-result/${file}" "${RUNNER_TEMP}/${file}"
            fi
          done

      # Defence in depth: even if the agent job were to report success with a failed verification
      # status, never push a dev build whose patch was not verified or explicitly skipped.
      - name: Require successful verification
        run: |
          set -euo pipefail
          STATUS_FILE="${RUNNER_TEMP}/verify-status"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::No verification result was recorded; refusing to publish"
            exit 1
          fi
          STATUS=$(cut -d'|' -f1 "$STATUS_FILE")
          case "$STATUS" in
            verified|skipped) ;;
            *)
              echo "::error::Verification status '${STATUS}' does not allow publishing"
              exit 1
              ;;
          esac
          echo "Verification status: ${STATUS}"

      - name: Validate generated changes
        run: python3 "${RUNNER_TEMP}/ai_patch.py" validate

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Commit and push to dev
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APP_NAME="app"
          if [ -f "${RUNNER_TEMP}/issue.json" ]; then
            APP_NAME=$(jq -r '.app_name // "app"' "${RUNNER_TEMP}/issue.json")
          fi
          APP_SAFE=$(printf '%s' "${APP_NAME}" | tr -d '\r\n' | cut -c1-60)

          git add -A -- patches/src extensions/extension/src
          if git diff --cached --quiet; then
            echo "::error::Nothing to commit"
            exit 1
          fi
          git commit \
            -m "feat(patches): add ${APP_SAFE} patch (#${ISSUE_NUMBER})" \
            -m "Automated patch generated from issue #${ISSUE_NUMBER}."

          git fetch origin dev
          git rebase origin/dev

          AUTH=$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" push origin HEAD:dev

          # A push made with GITHUB_TOKEN does not trigger other workflows, so start the
          # release and dev->main PR workflows explicitly.
          gh workflow run release.yml --ref dev \
            || echo "::warning::Could not dispatch release.yml; run it manually"
          gh workflow run open_pull_request.yml --ref dev \
            || echo "::warning::Could not dispatch open_pull_request.yml"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "${RUNNER_TEMP}/ai_patch.py" comment-success

  close-worked:
    name: Close confirmed issue
    needs: agent
    if: success() && needs.agent.outputs.mode == 'close'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .github/scripts/ai_patch.py "${RUNNER_TEMP}/ai_patch.py"
          python3 "${RUNNER_TEMP}/ai_patch.py" close

  notify-failure:
    name: Report failure
    needs: [agent, publish]
    if: failure() && needs.agent.outputs.mode != 'skip' && needs.agent.outputs.mode != 'close'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Pin helper script
        run: cp .github/scripts/ai_patch.py "${RUNNER_TEMP}/ai_patch.py"

      - name: Download result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ai-patch-result
          path: ${{ runner.temp }}/ai-patch-result

      - name: Restore diagnostics
        run: |
          for file in issue.json verify-status verify.log prepare-error.txt; do
            if [ -f "${RUNNER_TEMP}/ai-patch-result/${file}" ]; then
              cp "${RUNNER_TEMP}/ai-patch-result/${file}" "${RUNNER_TEMP}/${file}"
            fi
          done

      - name: Comment failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "${RUNNER_TEMP}/ai_patch.py" comment-failure

  unlock:
    name: Unlock issue
    needs:
      - lock
      - agent
      - publish
      - close-worked
      - notify-failure
    if: always() && needs.lock.outputs.locked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Unlock issue
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "::warning::No issue number; cannot unlock"
            exit 0
          fi
          if gh issue unlock "$ISSUE_NUMBER"; then
            echo "Unlocked issue #${ISSUE_NUMBER}"
          else
            echo "::warning::Could not unlock issue #${ISSUE_NUMBER}"
          fi
