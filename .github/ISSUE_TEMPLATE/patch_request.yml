name: 🧩 App patch request
description: Request a new patch for an app. An AI agent will try to build it automatically.
title: "patch: "
labels: ["ai-patch"]
body:
  - type: markdown
    attributes:
      value: |
        ## Request a patch

        Fill in every required field. An AI agent runs automatically when this issue is
        created, builds the patch, and replies here with a test build.

        > [!IMPORTANT]
        > Provide an `http(s)` link to one app file: `.apk`, `.apkm`, `.xapk` or `.apks`.
        > The agent resolves supported landing pages; links that require a sign-in may fail.

  - type: input
    id: app_name
    attributes:
      label: App name
      description: The app's name as it appears on your launcher or Play Store.
      placeholder: Example App
    validations:
      required: true

  - type: input
    id: package_name
    attributes:
      label: Package name
      description: >-
        The Android package name. Open the app's Play Store page and copy the value after
        `?id=` in the URL, for example `com.example.app`.
      placeholder: com.example.app
    validations:
      required: true

  - type: input
    id: apk_url
    attributes:
      label: App file download URL
      description: >-
        `http(s)` link to one `.apk`, `.apkm`, `.xapk` or `.apks` file. One URL only. Any host is
        accepted. For tmpfiles.org, either the preview page or its direct `/dl/` link works.
      placeholder: https://example.com/app.apk
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version (optional)
      description: The version of the APK above, if you know it. The agent detects it from the file anyway.
      placeholder: "1.2.3"

  - type: textarea
    id: request
    attributes:
      label: What should the patch do?
      description: >-
        Describe the behaviour to remove or change, for example "remove banner ads" or
        "unlock premium". Add screenshots or details that help locate the feature.
      placeholder: Remove the banner ads at the bottom of the main screen.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your request is skipped if these are not confirmed.
      options:
        - label: The link points to one APK/APKM/XAPK/APKS file.
          required: true
        - label: I understand an AI agent generates the patch and it may not work on the first attempt.
          required: true
